[package]
name = "rust_url_shortener"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web Framework
axum = "0.7"

# GraphQL
async-graphql = { version = "7.0", features = ["uuid"] }
async-graphql-axum = "7.0"

# Database
sqlx = { version = "0.7", default-features = false, features = [ "runtime-tokio-rustls", "postgres", "chrono", "uuid", "macros", "migrate" ] }

# Async Runtime & Utilities
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Configuration
dotenvy = "0.15"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }